name: Release

# Push a tag like v1.0.0 (or v1.1.0-beta.1 for a pre-release) to publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # needed to create the release and upload the zip

jobs:
  release:
    name: Publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test PCOpti.sln -c Release

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/PCOpti/PCOpti.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\PCOpti.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Move-Item "installer\Output\PCOpti-Setup-v${{ steps.version.outputs.version }}.exe" "PCOpti-Setup-${{ steps.version.outputs.tag }}.exe"

      - name: Zip portable version and write checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "PCOpti-$tag-win-x64-portable.zip"
          Copy-Item LICENSE, README.md publish/
          Compress-Archive -Path publish/PCOpti.exe, publish/LICENSE, publish/README.md -DestinationPath $zip
          $lines = foreach ($f in @("PCOpti-Setup-$tag.exe", $zip)) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f"
          }
          $lines | Out-File -Encoding ascii "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ghArgs = @($tag, "PCOpti-Setup-$tag.exe", "PCOpti-$tag-win-x64-portable.zip", "SHA256SUMS.txt",
                      "--title", "PCOpti $tag", "--generate-notes", "--verify-tag")
          if ("${{ steps.version.outputs.prerelease }}" -eq "True") { $ghArgs += "--prerelease" }
          gh release create @ghArgs
